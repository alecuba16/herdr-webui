name: Diag Linux composer test

on:
  push:
    branches:
      - diag-linux-composer

permissions:
  contents: read

jobs:
  diag:
    name: Run composer e2e on Linux with nocapture
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Full suite like the release job (cross-target x86_64)
        run: |
          rustup target add x86_64-unknown-linux-gnu
          cargo test --target-dir target --target x86_64-unknown-linux-gnu 2>&1 | tail -40