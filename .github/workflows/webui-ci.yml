name: WebUI CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --target-dir target --all-targets -- -D warnings

      - name: Check
        run: cargo check --target-dir target

      - name: JS tests
        run: node --test src/assets/*.test.mjs

      - name: Test
        run: cargo test --target-dir target

      - name: Composer e2e
        run: |
          if scripts/e2e/run-composer-e2e.sh; then
            exit 0
          fi
          echo "::warning::composer e2e failed on first attempt, retrying (possible runner timing flake)"
          echo "composer-e2e: first attempt failed, retrying" >> "$GITHUB_STEP_SUMMARY"
          if scripts/e2e/run-composer-e2e.sh; then
            echo "composer-e2e: retry passed (first-attempt failure was masked; see annotations)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "composer-e2e: retry also failed" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Lens e2e
        run: |
          if scripts/e2e/run-lens-e2e.sh; then
            exit 0
          fi
          echo "::warning::lens e2e failed on first attempt, retrying (possible runner timing flake)"
          echo "lens-e2e: first attempt failed, retrying" >> "$GITHUB_STEP_SUMMARY"
          if scripts/e2e/run-lens-e2e.sh; then
            echo "lens-e2e: retry passed (first-attempt failure was masked; see annotations)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "lens-e2e: retry also failed" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Lens chat e2e
        run: |
          if scripts/e2e/run-lens-chat-e2e.sh; then
            exit 0
          fi
          echo "::warning::lens chat e2e failed on first attempt, retrying (possible runner timing flake)"
          echo "lens-chat-e2e: first attempt failed, retrying" >> "$GITHUB_STEP_SUMMARY"
          if scripts/e2e/run-lens-chat-e2e.sh; then
            echo "lens-chat-e2e: retry passed (first-attempt failure was masked; see annotations)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "lens-chat-e2e: retry also failed" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Build release
        run: cargo build --release --target-dir target

      - name: Version contains commit hash
        run: |
          short_sha="${GITHUB_SHA::12}"
          if [ "$GITHUB_REF_NAME" = "main" ] || [ "$GITHUB_REF_NAME" = "master" ]; then
            expected="${GITHUB_REF_NAME}-${short_sha}"
          else
            expected="snapshot-${short_sha}"
          fi
          version="$(target/release/herdr-webui --version)"
          echo "version=$version"
          test "$version" = "$expected"
