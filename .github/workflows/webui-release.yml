name: WebUI Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS ${{ matrix.target }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            artifact: herdr-webui-macos-aarch64
          - target: x86_64-apple-darwin
            artifact: herdr-webui-macos-x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate SemVer tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must be vMAJOR.MINOR.PATCH"
            exit 1
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --target-dir target

      - name: Build release
        run: cargo build --release --bins --target-dir target --target ${{ matrix.target }}

      - name: Verify release version
        run: |
          actual="$(target/${{ matrix.target }}/release/herdr-webui --version)"
          echo "version=$actual"
          test "$actual" = "$GITHUB_REF_NAME"

      - name: Package
        run: |
          mkdir -p dist/${{ matrix.artifact }}
          cp target/${{ matrix.target }}/release/herdr-webui dist/${{ matrix.artifact }}/herdr-webui
          cp target/${{ matrix.target }}/release/herdr-webui-tui dist/${{ matrix.artifact }}/herdr-webui-tui
          chmod 755 dist/${{ matrix.artifact }}/herdr-webui
          chmod 755 dist/${{ matrix.artifact }}/herdr-webui-tui
          cat > dist/${{ matrix.artifact }}/README.txt <<'EOF'
          Install (also installs herdr-webui-tui into ~/.local/bin):
            ./herdr-webui install-mac

          Update existing LaunchAgent install (refreshes both binaries):
            ./herdr-webui update-mac

          Uninstall LaunchAgent:
            ./herdr-webui uninstall-mac

          Terminal UI:
            ./herdr-webui-tui --summary
            ./herdr-webui-tui --theme system
          EOF
          tar -C dist -czf dist/${{ matrix.artifact }}.tar.gz ${{ matrix.artifact }}
          shasum -a 256 dist/${{ matrix.artifact }}.tar.gz > dist/${{ matrix.artifact }}.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}.tar.gz
            dist/${{ matrix.artifact }}.tar.gz.sha256

  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate SemVer tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must be vMAJOR.MINOR.PATCH"
            exit 1
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --target-dir target

      - name: Build release
        run: cargo build --release --bins --target-dir target --target x86_64-unknown-linux-gnu

      - name: Verify release version
        run: |
          actual="$(target/x86_64-unknown-linux-gnu/release/herdr-webui --version)"
          echo "version=$actual"
          test "$actual" = "$GITHUB_REF_NAME"

      - name: Package
        run: |
          mkdir -p dist/herdr-webui-linux-x86_64
          cp target/x86_64-unknown-linux-gnu/release/herdr-webui dist/herdr-webui-linux-x86_64/herdr-webui
          cp target/x86_64-unknown-linux-gnu/release/herdr-webui-tui dist/herdr-webui-linux-x86_64/herdr-webui-tui
          chmod 755 dist/herdr-webui-linux-x86_64/herdr-webui
          chmod 755 dist/herdr-webui-linux-x86_64/herdr-webui-tui
          cat > dist/herdr-webui-linux-x86_64/README.txt <<'EOF'
          Run:
            ./herdr-webui --bind 127.0.0.1:8787

          Local development auth bypass:
            HERDR_WEB_LOCALHOST_NO_AUTH=true ./herdr-webui --bind 127.0.0.1:8787

          Install as user service (also installs herdr-webui-tui into ~/.local/bin):
            ./herdr-webui install-linux

          Update existing install (refreshes both binaries):
            ./herdr-webui update-linux

          Terminal UI:
            ./herdr-webui-tui --summary
            ./herdr-webui-tui --theme system
          EOF
          tar -C dist -czf dist/herdr-webui-linux-x86_64.tar.gz herdr-webui-linux-x86_64
          sha256sum dist/herdr-webui-linux-x86_64.tar.gz > dist/herdr-webui-linux-x86_64.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: herdr-webui-linux-x86_64
          path: |
            dist/herdr-webui-linux-x86_64.tar.gz
            dist/herdr-webui-linux-x86_64.tar.gz.sha256

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - build-macos
      - build-linux
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Herdr WebUI ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.sha256

  publish-tap:
    name: Update Homebrew tap
    runs-on: ubuntu-latest
    needs: release
    # Reuses the tap's own generator so the formula here and the formula the
    # daily poll produces can never drift apart.
    steps:
      - name: Check tap token
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is not set in repo secrets. The formula push to the tap is skipped until the secret is added (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          # A 401/403 here means expired or wrongly scoped: fail this step so
          # the release page shows the tap update did not happen.
          if ! gh api --method GET repos/alecuba16/homebrew-tap \
              -H "Authorization: Bearer $HOMEBREW_TAP_TOKEN" > /dev/null 2>&1; then
            echo "::error::HOMEBREW_TAP_TOKEN was rejected (expired or missing tap access). Rotate it: Settings > Secrets and variables > Actions > HOMEBREW_TAP_TOKEN."
            exit 1
          fi
          echo "tap token accepted"

      - name: Checkout tap
        uses: actions/checkout@v7
        with:
          repository: alecuba16/homebrew-tap
          # Fine-grained PAT, contents:write on alecuba16/homebrew-tap only.
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Regenerate formula for ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          chmod +x scripts/generate_formula.sh
          # Explicit tag: no latest-release race with the just-published one.
          ./scripts/generate_formula.sh Formula/herdr-webui.rb "${GITHUB_REF_NAME}"
          ruby -c Formula/herdr-webui.rb

      - name: Commit when changed
        run: |
          if git diff --quiet -- Formula/herdr-webui.rb; then
            echo "formula already at ${GITHUB_REF_NAME}, nothing to commit"
            exit 0
          fi
          git config user.name "alecuba16-release-bot"
          git config user.email "actions@github.com"
          git add Formula/herdr-webui.rb
          git commit -m "herdr-webui ${GITHUB_REF_NAME#v}"
          # The tap's daily poll can race this push; rebase once on the fresh
          # tip and retry. Single-file regeneration rebases trivially.
          git push || { git pull --rebase origin main && git push; }
